name: Go tests
on:
  pull_request:
  push:
    branches: [main, claude/apple-sdk-support-ASP5O]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check module dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Connect generated sources
        run: |
          python3 scripts/generate_models.py connect scripts/upstream/connect-4.5.1.json
          python3 scripts/generate_connect_api.py scripts/upstream/connect-4.5.1.json
          git diff --exit-code -- appstoreconnect
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
